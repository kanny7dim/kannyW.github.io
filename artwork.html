<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Art Work</title>
<style>
:root{
  --bg:#0b0b0f;
  --fg:#ffffff;
  --neon:#00ff66; /* 荧光绿 */
}
html,body{
  margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
  font-family:"Helvetica Neue", Arial, sans-serif; overflow:hidden;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" height="28" width="28"><circle cx="14" cy="14" r="5" fill="%2300ff66"/></svg>') 14 14, auto;
}

/* 星空背景 */
canvas#bgCanvas{ position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; }

/* 返回按钮 */
a.back-btn{
  position:fixed; right:32px; top:26px; z-index:30;
  color:#fff; text-decoration:none; font-size:30px; text-shadow:0 0 12px #fff;
}

/* 类别（中间） */
.title-wrap{
  position:absolute; left:50%; top:45%; transform:translate(-50%,-50%);
  z-index:20; display:flex; gap:40px; align-items:center;
  font-size:32px; font-weight:700; text-shadow:0 0 12px rgba(255,255,255,0.85);
}
.title-wrap .cat{
  position:relative; cursor:pointer; white-space:nowrap;
  transition:text-shadow .25s;
}
.title-wrap .cat:hover{ text-shadow:0 0 24px var(--neon); }

/* 系列容器 */
.series-container{
  position:absolute; left:0; top:0; width:100%; height:100%; z-index:22;
  pointer-events:none;
}

/* 系列文字 */
.series-item{
  position:absolute; white-space:nowrap;
  font-size:18px; font-weight:700;
  color:var(--fg); text-shadow:0 0 10px rgba(255,255,255,0.85);
  opacity:0; transition:opacity 1.5s ease, transform .5s ease;
  pointer-events:auto;
}
.series-item.visible{ opacity:1; text-shadow:0 0 25px var(--neon); }
.series-item:hover{ text-shadow:0 0 35px var(--neon); transform:translateY(-4px); }

/* footer */
.footer-text{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  width:90%; text-align:center; font-size:16px; line-height:1.5;
  text-shadow:0 0 12px #fff; color:#fff;
}

/* 响应式 */
@media(max-width:768px){
  .title-wrap{ font-size:22px; gap:20px; }
  .series-item{ font-size:15px; }
  .footer-text{ font-size:13px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<a href="index.html" class="back-btn">←</a>

<div class="title-wrap">
  <div class="cat" id="cat-photography">Photography</div>
  <div class="cat" id="cat-sound">Sound</div>
  <div class="cat" id="cat-sculpture">Sculpture</div>
</div>

<div class="series-container" id="seriesContainer"></div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
/* 星空背景 */
const bg = document.getElementById('bgCanvas');
const ctx = bg.getContext('2d');
let W=0,H=0;
function resize(){
  W=bg.clientWidth; H=bg.clientHeight; bg.width=W; bg.height=H;
}
window.addEventListener('resize',resize);
resize();
const stars = Array.from({length:140},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.6+0.2,
  vx:(Math.random()-0.5)*0.0006, vy:(Math.random()-0.5)*0.0006
}));
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.95)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.35+Math.random()*0.5)+')';
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

/* 类别与系列 */
const data={
  photography:[
    {label:'Endless World',href:'endless-world.html'},
    {label:'Time Line',href:'timeline.html'},
    {label:'Perception',href:'perception.html'}
  ],
  sound:[
    {label:'SoundScape',href:'soundscape.html'},
    {label:'Deep Listening',href:'deeplistening.html'}
  ],
  sculpture:[
    {label:'Reshaping',href:'reshaping.html'}
  ]
};
const cats={
  photography:document.getElementById('cat-photography'),
  sound:document.getElementById('cat-sound'),
  sculpture:document.getElementById('cat-sculpture')
};
const container=document.getElementById('seriesContainer');
let allSeries={};

function createSeries(){
  container.innerHTML='';
  for(const key in data){
    allSeries[key]=data[key].map((item,i)=>{
      const el=document.createElement('div');
      el.className='series-item';
      el.textContent=item.label;
      el.style.transitionDelay=`${i*0.25}s`;
      el.addEventListener('click',()=>{window.location.href=item.href});
      container.appendChild(el);
      return el;
    });
  }
}
createSeries();

function alignSeries(){
  for(const key in data){
    const catRect=cats[key].getBoundingClientRect();
    const baseLeft=catRect.left;
    const baseTop=catRect.top+catRect.height+20;
    allSeries[key].forEach((el,i)=>{
      el.style.left=`${baseLeft}px`;
      el.style.top=`${baseTop+i*26}px`;
    });
  }
}
alignSeries();
window.addEventListener('resize',alignSeries);

function showSeries(key){
  for(const k in allSeries){
    allSeries[k].forEach(el=>{
      el.classList.remove('visible');
      el.style.opacity='0';
    });
  }
  allSeries[key].forEach(el=>{
    el.classList.add('visible');
    el.style.opacity='1';
  });
}
function hideAll(){
  for(const k in allSeries){
    allSeries[k].forEach(el=>{
      el.classList.remove('visible');
      el.style.opacity='0';
    });
  }
}
Object.keys(cats).forEach(k=>{
  cats[k].addEventListener('mouseenter',()=>showSeries(k));
  cats[k].addEventListener('mouseleave',()=>hideAll());
});
</script>

</body>
</html>
