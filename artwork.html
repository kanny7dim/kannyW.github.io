<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f; /* 星空背景 */
  --fg: #ffffff;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 60px;
  font-size: 32px;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  transition: text-shadow 0.5s, transform 0.5s;
  animation: glowMove 2s infinite alternate;
}
.title-wrap div:hover {
  text-shadow: 0 0 35px rgba(0,255,127,1);
  transform: translateY(-2px);
}
@keyframes glowMove {
  0% { text-shadow: 0 0 10px rgba(0,255,127,0.7); transform: translateY(0); }
  100% { text-shadow: 0 0 20px rgba(0,255,127,0.5); transform: translateY(2px); }
}

/* 返回主页按钮 */
.back-home {
  position: fixed;
  top: 20px;
  right: 30px;
  font-size: 38px;
  color: #fff;
  text-shadow: 0 0 15px rgba(255,255,255,0.9);
  cursor: pointer;
  z-index: 3;
  transition: text-shadow 0.3s, transform 0.3s;
}
.back-home:hover {
  text-shadow: 0 0 25px rgba(0,255,127,1);
  transform: scale(1.1);
}

/* 底部文字 */
.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
  word-wrap: break-word;
}

@media(max-width:768px){
  .title-wrap {
    flex-direction: column;
    gap: 30px;
    font-size: 24px;
  }
  .footer-text { font-size: 14px; bottom: 20px; }
}
</style>
</head>
<body>

<!-- 星空背景 -->
<canvas id="bgCanvas"></canvas>

<!-- 返回主页按钮 -->
<div class="back-home" onclick="location.href='index.html'">&#8592;</div>

<!-- 类别标题 -->
<div class="title-wrap">
  <div onclick="location.href='endlessworld.html'">EndlessWorld</div>
  <div onclick="location.href='perception.html'">Perception</div>
  <div onclick="location.href='deeplistening.html'">DeepListening</div>
  <div onclick="location.href='reshaping.html'">Reshaping</div>
</div>

<!-- 底部文字 -->
<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
// 星空背景
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  W=canvas.clientWidth; 
  H=canvas.clientHeight; 
  canvas.width=W; 
  canvas.height=H;
}
window.addEventListener('resize',resize);
resize();

const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));

function drawStars(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();
</script>

</body>
</html>
