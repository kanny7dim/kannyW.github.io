<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f; /* 星空背景色 */
  --fg: #ffffff;
  --work-bg: #bfbfbf; /* 莫兰迪灰背景 */
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 60px;
  font-size: 32px;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  transition: text-shadow 0.5s, transform 0.5s;
  animation: glowMove 2s infinite alternate;
}
.title-wrap div:hover {
  text-shadow: 0 0 35px rgba(0,255,127,1);
  transform: translateY(-2px);
}
@keyframes glowMove {
  0% { text-shadow: 0 0 10px rgba(0,255,127,0.7); transform: translateY(0); }
  100% { text-shadow: 0 0 20px rgba(0,255,127,0.5); transform: translateY(2px); }
}

#gallery {
  display: none;
  position: absolute;
  top:0; left:0;
  width: 100%; height: 100%;
  background: var(--work-bg);
  overflow-y: auto;
  z-index: 2;
  padding: 60px 20px 20px 20px;
  box-sizing: border-box;
}
#gallery img {
  width: 300px;
  height: auto;
  margin: 10px;
  cursor: pointer;
  display: inline-block;
}
#lightbox {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index: 10;
}
#lightbox img {
  max-width:90%;
  max-height:90%;
}
#lightbox .close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 36px;
  color: #000;
  cursor: pointer;
  z-index: 11;
}

.back-btn {
  display: none;
}

@media(max-width:768px){
  .title-wrap {
    flex-direction: column;
    gap: 30px;
    font-size: 24px;
  }
  #gallery img { width: 90%; max-width: 300px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="title-wrap" id="categories">
  <div id="endlessBtn">EndlessWorld</div>
  <div id="perceptionBtn">Perception</div>
  <div id="deepBtn">DeepListening</div>
  <div id="reshapeBtn">Reshaping</div>
</div>

<!-- Gallery -->
<div id="gallery">
  <span class="close-btn" onclick="closeGallery()">&times;</span>
  <img src="EndlessWorld01.jpg.JPG" alt="Endless World 1">
  <img src="EndlessWorld02.jpg.JPG" alt="Endless World 2">
  <img src="EndlessWorld03.jpg.JPG" alt="Endless World 3">
  <img src="EndlessWorld04.jpg.JPG" alt="Endless World 4">
  <img src="EndlessWorld05.jpg.JPG" alt="Endless World 5">
</div>

<!-- Lightbox -->
<div id="lightbox">
  <span class="close-btn" onclick="closeLightbox()">&times;</span>
  <img src="" alt="">
</div>

<script>
// 星空背景
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  W=canvas.clientWidth; 
  H=canvas.clientHeight; 
  canvas.width=W; 
  canvas.height=H;
}
window.addEventListener('resize',resize);
resize();

const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
function drawStars(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// 点击进入 EndlessWorld
const categories = document.getElementById('categories');
const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = lightbox.querySelector('img');

document.getElementById('endlessBtn').addEventListener('click', ()=>{
  categories.style.display='none';
  gallery.style.display='block';
});

function closeGallery(){
  gallery.style.display='none';
  categories.style.display='flex';
}

// Lightbox
const galleryImgs = gallery.querySelectorAll('img');
galleryImgs.forEach(img=>{
  img.addEventListener('click', ()=>{
    lbImg.src = img.src;
    lightbox.style.display='flex';
  });
});
function closeLightbox(){
  lightbox.style.display='none';
}
</script>

</body>
</html>
