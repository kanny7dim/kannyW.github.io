<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f;
  --fg: #ffffff;
  --cursor: #00ff9f;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  cursor: none;
}
canvas#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.back-btn {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 32px;
  color: #fff;
  text-decoration: none;
  text-shadow: 0 0 12px #fff;
  z-index: 3;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 80px;
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  position: relative;
}
.title-wrap div:hover {
  text-shadow: 0 0 25px rgba(255,255,255,1);
}
.series-wrap {
  position: absolute;
  top: 55%;
  z-index: 2;
  display: none;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  font-size: 20px;
  font-weight: 600;
  color: var(--fg);
  opacity: 0;
  transition: opacity 2s ease;
  text-shadow: 0 0 14px rgba(255,255,255,1);
}
.series-wrap div {
  cursor: pointer;
}
.series-wrap div:hover {
  text-shadow: 0 0 25px rgba(255,255,255,1);
}
.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
}
.custom-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--cursor);
  box-shadow: 0 0 15px var(--cursor);
  pointer-events: none;
  z-index: 10;
  transform: translate(-50%, -50%);
}
@media(max-width:768px){
  .title-wrap { font-size: 24px; gap: 30px; }
  .series-wrap { font-size: 16px; gap: 8px; }
  .footer-text { font-size: 14px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<a href="index.html" class="back-btn">←</a>

<div class="title-wrap">
  <div id="photographyBtn">Photography</div>
  <div id="soundBtn">Sound</div>
  <div id="sculptureBtn">Sculpture</div>
</div>

<!-- 系列 -->
<div class="series-wrap" id="photoSeries">
  <div onclick="location.href='endless-world.html'">Endless World</div>
  <div onclick="location.href='timeline.html'">Time Line</div>
  <div onclick="location.href='perception.html'">Perception</div>
</div>

<div class="series-wrap" id="soundSeries">
  <div onclick="location.href='soundscape.html'">Soundscape</div>
  <div onclick="location.href='deep-listening.html'">Deep Listening</div>
</div>

<div class="series-wrap" id="sculptureSeries">
  <div onclick="location.href='reshaping.html'">Reshaping</div>
</div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<div class="custom-cursor" id="cursor"></div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// 星空背景
const stars = Array.from({length:150}, () => ({
  x: Math.random(), y: Math.random(), r: Math.random()*1.5+0.2,
  vx: (Math.random()-0.5)*0.0005, vy: (Math.random()-0.5)*0.0005
}));
function drawStars(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = 'rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for (const s of stars){
    s.x += s.vx; s.y += s.vy;
    if (s.x<0)s.x=1; if (s.x>1)s.x=0;
    if (s.y<0)s.y=1; if (s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// 对齐系列与类别首字母
function alignSeries() {
  const photoBtn = document.getElementById('photographyBtn').getBoundingClientRect();
  const soundBtn = document.getElementById('soundBtn').getBoundingClientRect();
  const sculptureBtn = document.getElementById('sculptureBtn').getBoundingClientRect();
  const offsetY = window.innerHeight * 0.55;

  const photoSeries = document.getElementById('photoSeries');
  photoSeries.style.left = photoBtn.left + "px";
  photoSeries.style.top = offsetY + "px";

  const soundSeries = document.getElementById('soundSeries');
  soundSeries.style.left = soundBtn.left + "px";
  soundSeries.style.top = offsetY + "px";

  const sculptureSeries = document.getElementById('sculptureSeries');
  sculptureSeries.style.left = sculptureBtn.left + "px";
  sculptureSeries.style.top = offsetY + "px";
}
window.addEventListener('resize', alignSeries);
window.addEventListener('load', alignSeries);

// 点击类别显示系列
const seriesMap = {
  photographyBtn: 'photoSeries',
  soundBtn: 'soundSeries',
  sculptureBtn: 'sculptureSeries'
};
document.addEventListener('click', (e)=>{
  let clickedSeries = false;
  for (let key in seriesMap){
    const btn = document.getElementById(key);
    const series = document.getElementById(seriesMap[key]);
    if (btn.contains(e.target)) {
      clickedSeries = true;
      const isVisible = series.style.display === 'flex';
      document.querySelectorAll('.series-wrap').forEach(s=>{
        s.style.display = 'none';
        s.style.opacity = 0;
      });
      if (!isVisible) {
        series.style.display = 'flex';
        requestAnimationFrame(()=>{ series.style.opacity = 1; });
      }
    }
  }
  if (!clickedSeries && !document.querySelector('.series-wrap:hover')) {
    document.querySelectorAll('.series-wrap').forEach(s=>{
      s.style.display = 'none';
      s.style.opacity = 0;
    });
  }
});

// 光标荧光绿效果
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', (e)=>{
  cursor.style.top = e.clientY + 'px';
  cursor.style.left = e.clientX + 'px';
});
</script>

</body>
</html>
