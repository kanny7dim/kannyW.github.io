<!-- artwork.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f; /* 星空主页背景 */
  --fg: #ffffff;
  --work-bg: #b0b0b0; /* 莫兰迪灰作品背景 */
}
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family:"Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow-x:hidden;
}
canvas#bgCanvas {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  z-index:0;
}
.title-wrap {
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%, -50%);
  display:flex;
  gap:40px;
  font-size:32px;
  font-weight:700;
  z-index:2;
  flex-wrap:wrap;
  white-space:nowrap;
}
.title-wrap div {
  cursor:pointer;
}
.back-btn {
  position:fixed;
  top:30px;
  left:30px;
  font-size:32px;
  color:#fff;
  text-decoration:none;
  z-index:5;
  display:none;
}
#work-view {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: var(--work-bg);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:10;
}
#work-view img {
  max-width:90%;
  max-height:80%;
  margin:10px 0;
  cursor:pointer;
}
.lightbox-controls {
  display:flex;
  gap:20px;
  margin-top:10px;
}
.lightbox-controls button {
  font-size:24px;
  padding:8px 12px;
  cursor:pointer;
}
@media(max-width:768px){
  .title-wrap { font-size:24px; gap:20px; top:40%; }
  .lightbox-controls button { font-size:20px; padding:6px 10px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="title-wrap" id="categories">
  <div data-category="endlessworld">EndlessWorld</div>
  <div data-category="perception">Perception</div>
  <div data-category="deeplistening">DeepListening</div>
  <div data-category="reshaping">Reshaping</div>
</div>

<a href="#" class="back-btn" id="backBtn">←</a>

<div id="work-view">
  <img src="" alt="" id="currentImg">
  <div class="lightbox-controls">
    <button id="prevBtn">←</button>
    <button id="nextBtn">→</button>
  </div>
</div>

<script>
// 星空背景
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W; canvas.height=H;}
window.addEventListener('resize',resize);
resize();

const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// 图片库（目前只有 EndlessWorld，可依次添加其他作品）
const imageMap = {
  endlessworld: [
    'EndlessWorld01.jpg.JPG',
    'EndlessWorld02.jpg.JPG',
    'EndlessWorld03.jpg.JPG',
    'EndlessWorld04.jpg.JPG',
    'EndlessWorld05.jpg.JPG'
  ],
  perception: [], // 以后放
  deeplistening: [],
  reshaping: []
};

const categories = document.querySelectorAll('#categories div');
const workView = document.getElementById('work-view');
const currentImg = document.getElementById('currentImg');
const backBtn = document.getElementById('backBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentCategory = '';
let currentIndex = 0;

categories.forEach(cat=>{
  cat.addEventListener('click', ()=>{
    currentCategory = cat.dataset.category;
    if(imageMap[currentCategory].length===0) return;
    currentIndex=0;
    currentImg.src = imageMap[currentCategory][currentIndex];
    workView.style.display='flex';
    backBtn.style.display='block';
    document.getElementById('categories').style.display='none';
  });
});

backBtn.addEventListener('click', ()=>{
  workView.style.display='none';
  backBtn.style.display='none';
  document.getElementById('categories').style.display='flex';
});

prevBtn.addEventListener('click', ()=>{
  if(!currentCategory) return;
  currentIndex = (currentIndex -1 + imageMap[currentCategory].length)%imageMap[currentCategory].length;
  currentImg.src = imageMap[currentCategory][currentIndex];
});
nextBtn.addEventListener('click', ()=>{
  if(!currentCategory) return;
  currentIndex = (currentIndex +1)%imageMap[currentCategory].length;
  currentImg.src = imageMap[currentCategory][currentIndex];
});
</script>

</body>
</html>
