<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f;
  --fg: #ffffff;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas, canvas#starMap {
  position: absolute;
  top:0; left:0;
  width: 100%; height: 100%;
  z-index: 0;
}
.back-btn {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 32px;
  color: #fff;
  text-decoration: none;
  text-shadow: 0 0 12px #fff;
  z-index: 3;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 30px;
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  position: relative;
}
.title-wrap div:hover {
  text-shadow: 0 0 25px rgba(255,255,255,1);
}
.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
  word-wrap: break-word;
}
.photography-series {
  position: absolute;
  z-index: 2;
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  text-shadow: 0 0 12px #fff;
  display: none;
}
.photography-series div {
  margin: 8px 0;
  cursor: pointer;
}
@media(max-width:768px){
  .title-wrap { font-size: 24px; gap: 20px; }
  .footer-text { font-size: 14px; }
  .photography-series { font-size: 14px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="starMap"></canvas>

<a href="index.html" class="back-btn">←</a>

<div class="title-wrap">
  <div id="photographyBtn">Photography</div>
  <div onclick="location.href='sound.html'">Sound</div>
  <div onclick="location.href='sculpture.html'">Sculpture</div>
</div>

<div class="photography-series" id="photographySeries">
  <div>Endless World</div>
  <div>Time Line</div>
  <div>Perception</div>
</div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W; canvas.height=H; starMap.width=W; starMap.height=H; }
window.addEventListener('resize',resize);
resize();

// 星空粒子背景
const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
function drawStars(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// 中间三个单词漂浮动画
const titles = document.querySelectorAll('.title-wrap div');
titles.forEach(t=>{
  let posX=0, posY=0;
  function floatAnim(){
    posX += (Math.random()-0.5)*0.3;
    posY += (Math.random()-0.5)*0.3;
    t.style.transform=`translate(${posX}px, ${posY}px)`;
    requestAnimationFrame(floatAnim);
  }
  floatAnim();
});

// Photography 系列显示
const photoBtn = document.getElementById('photographyBtn');
const photoSeries = document.getElementById('photographySeries');
const starMap = document.getElementById('starMap');
const smCtx = starMap.getContext('2d');

photoBtn.addEventListener('click', ()=>{
  photoSeries.style.display = (photoSeries.style.display==='block') ? 'none':'block';
  drawStarLines();
});

function drawStarLines(){
  const rect = photoBtn.getBoundingClientRect();
  const x0 = rect.left + rect.width/2;
  const y0 = rect.bottom + 10;
  const items = Array.from(photoSeries.children);
  const positions = items.map(el=>{
    const r = el.getBoundingClientRect();
    const x = r.left + r.width/2;
    const y = r.top + r.height/2;
    return {x,y};
  });

  smCtx.clearRect(0,0,starMap.width, starMap.height);
  smCtx.strokeStyle='rgba(255,255,255,0.8)';
  smCtx.lineWidth=1.5;
  for(const p of positions){
    smCtx.beginPath();
    smCtx.moveTo(x0,y0);
    smCtx.lineTo(p.x,p.y);
    smCtx.stroke();
  }
}
</script>

</body>
</html>
