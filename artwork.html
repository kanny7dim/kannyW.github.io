<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless World</title>
<style>
:root { --bg:#cfcfcf; --fg:#000; }
html, body {
  margin:0; padding:0;
  font-family:"Helvetica Neue", Arial, sans-serif;
  background:var(--bg);
  color:var(--fg);
}
.back-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 32px;
  color: #000;
  text-decoration: none;
  z-index: 10;
}
.gallery {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:80px 20px 40px 20px;
}
.gallery img {
  max-width:300px;
  width:100%;
  height:auto;
  cursor:pointer;
}
#lightbox {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:20;
}
#lightbox img {
  max-width:90%;
  max-height:90%;
}
#lightbox .close-btn {
  position:fixed;
  top:20px; right:20px;
  font-size:32px;
  color:#fff;
  cursor:pointer;
  z-index:25;
}
</style>
</head>
<body>

<a href="artwork.html" class="back-btn">←</a>

<div class="gallery">
  <img src="EndlessWorld01.jpg.JPG" alt="">
  <img src="EndlessWorld02.jpg.JPG" alt="">
  <img src="EndlessWorld03.jpg.JPG" alt="">
  <img src="EndlessWorld04.jpg.JPG" alt="">
  <img src="EndlessWorld05.jpg.JPG" alt="">
</div>

<div id="lightbox">
  <span class="close-btn">&times;</span>
  <img src="" alt="">
</div>

<script>
const lightbox = document.getElementById('lightbox');
const lbImg = lightbox.querySelector('img');
const closeBtn = lightbox.querySelector('.close-btn');
const imgs = document.querySelectorAll('.gallery img');

imgs.forEach(img => {
  img.addEventListener('click', () => {
    lbImg.src = img.src;
    lightbox.style.display = 'flex';
  });
});

closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
  if(e.target === lightbox) lightbox.style.display = 'none';
});
</script>

</body>
</html>
