<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Work</title>
<style>
:root{
  --bg:#0b0b0f;
  --fg:#ffffff;
  --arrow-color:#00ff7f;
  --arrow-shadow:0 0 12px #00ff7f;
}

/* 基础样式 */
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--fg);
  overflow:hidden;
}

/* 星空背景 */
canvas#bgCanvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
}

/* 返回箭头 */
.back-btn{
  position:fixed;
  top:18px;right:18px;
  font-size:clamp(22px,4vw,32px);
  font-weight:bold;
  cursor:pointer;
  z-index:3;
  text-shadow:var(--arrow-shadow);
  color:var(--arrow-color);
  transition:transform .15s,text-shadow .15s;
}
.back-btn:hover{
  transform:scale(1.1);
  text-shadow:0 0 25px var(--arrow-color),0 0 35px var(--arrow-color);
}

/* 类别首页 */
#categories{
  display:flex;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  gap:40px;
  font-size:clamp(18px,4vw,28px);
  font-weight:700;
}
#categories div{
  cursor:pointer;
  transition:transform .3s,text-shadow .3s;
}
#categories div:hover{
  text-shadow:0 0 35px var(--arrow-color);
  transform:translateY(-2px);
}

/* 作品页通用 */
.viewPage{
  display:none;
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#fff;
  overflow:hidden;
}

/* 作品图片 */
.viewPage img{
  max-width:90%; max-height:80%;
  cursor:zoom-in;
  object-fit:contain;
  transition:transform 0.25s ease;
}

/* 左右切换箭头 */
.nav-btn{
  position:absolute;
  bottom:36px;
  font-size:clamp(22px,4vw,32px);
  color:#00ff7f;
  text-shadow:0 0 12px #00ff7f;
  cursor:pointer;
  z-index:3;
  user-select:none;
}
.nav-btn:hover{
  transform:scale(1.1);
  text-shadow:0 0 25px #00ff7f;
}
.left-btn{left:20px;}
.right-btn{right:20px;}

/* Deep Listening 内容 */
#deepPage h2{
  color:#000;
  margin-top:60px;
  text-align:center;
}

/* 响应式 */
@media(max-width:600px){
  #categories{
    flex-direction:column;
    top:40%;
  }
  .nav-btn{bottom:20px;font-size:24px;}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- 类别首页返回上一级 -->
<div id="homeBack" class="back-btn">&#8592;</div>

<div id="categories">
  <div id="endlessBtn">EndlessWorld</div>
  <div id="perceptionBtn">Perception</div>
  <div id="reshapeBtn">Reshaping</div>
  <div id="deepBtn">DeepListening</div>
</div>

<!-- EndlessWorld 作品页 -->
<div id="endlessView" class="viewPage">
  <span class="back-btn" onclick="closeView('endlessView')">&#8592;</span>
  <img id="endlessImg" src="EndlessWorld01.jpg.JPG" alt="EndlessWorld">
  <span class="nav-btn left-btn" onclick="changeImg('endless',-1)">&#10094;</span>
  <span class="nav-btn right-btn" onclick="changeImg('endless',1)">&#10095;</span>
</div>

<!-- Perception 作品页 -->
<div id="perceptionView" class="viewPage">
  <span class="back-btn" onclick="closeView('perceptionView')">&#8592;</span>
  <img id="perceptionImg" src="Perceptionnew01.jpg.JPG" alt="Perception">
  <span class="nav-btn left-btn" onclick="changeImg('perception',-1)">&#10094;</span>
  <span class="nav-btn right-btn" onclick="changeImg('perception',1)">&#10095;</span>
</div>

<!-- Reshaping 作品页 -->
<div id="reshapeView" class="viewPage">
  <span class="back-btn" onclick="closeView('reshapeView')">&#8592;</span>
  <img id="reshapeImg" src="Reshaping01.jpg.JPG" alt="Reshaping">
  <span class="nav-btn left-btn" onclick="changeImg('reshape',-1)">&#10094;</span>
  <span class="nav-btn right-btn" onclick="changeImg('reshape',1)">&#10095;</span>
</div>

<!-- Deep Listening 作品页 -->
<div id="deepPage" class="viewPage">
  <span class="back-btn" onclick="closeView('deepPage')">&#8592;</span>
  <h2>Deep Listening Content</h2>
</div>

<script>
// 星空背景
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W;canvas.height=H;}
window.addEventListener('resize',resize);resize();
const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+0.2,vx:(Math.random()-0.5)*0.0005,vy:(Math.random()-0.5)*0.0005}));
function drawStars(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x+=s.vx;s.y+=s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// 首页返回上一级
document.getElementById('homeBack').onclick=function(){
  window.history.back(); // 返回上一页
};

// 类别按钮打开作品页
document.getElementById('endlessBtn').onclick=()=>openView('endlessView');
document.getElementById('perceptionBtn').onclick=()=>openView('perceptionView');
document.getElementById('reshapeBtn').onclick=()=>openView('reshapeView');
document.getElementById('deepBtn').onclick=()=>openView('deepPage');

// 作品页图片数组
const endlessImgs=["EndlessWorld01.jpg.JPG","EndlessWorld02.jpg.JPG","EndlessWorld03.jpg.JPG","EndlessWorld04.jpg.JPG","EndlessWorld05.jpg.JPG"];
let endlessIndex=0;

const perceptionImgs=["Perceptionnew01.jpg.JPG","Perceptionnew02.jpg.JPG","Perceptionnew03.jpg.JPG","Perceptionnew04.jpg.JPG","Perceptionnew05.jpg.JPG","Perceptionnew06.jpg.JPG","Perceptionnew07.jpg.JPG"];
let perceptionIndex=0;

const reshapeImgs=["Reshaping01.jpg.JPG","Reshaping02.jpg.JPG","Reshaping03.jpg.JPG","Reshaping04.jpg.JPG","Reshaping05.jpg.JPG","Reshaping06.jpg.JPG","Reshaping07.jpg.JPG"];
let reshapeIndex=0;

// 打开和关闭作品页
function openView(id){
  document.getElementById(id).style.display='flex';
  document.getElementById('categories').style.display='none';
  document.getElementById('homeBack').style.display='none';
}

function closeView(id){
  document.getElementById(id).style.display='none';
  document.getElementById('categories').style.display='flex';
  document.getElementById('homeBack').style.display='block';
}

// 切换图片
function changeImg(type,dir){
  if(type==='endless'){
    endlessIndex=(endlessIndex+dir+endlessImgs.length)%endlessImgs.length;
    document.getElementById('endlessImg').src=endlessImgs[endlessIndex];
  }
  if(type==='perception'){
    perceptionIndex=(perceptionIndex+dir+perceptionImgs.length)%perceptionImgs.length;
    document.getElementById('perceptionImg').src=perceptionImgs[perceptionIndex];
  }
  if(type==='reshape'){
    reshapeIndex=(reshapeIndex+dir+reshapeImgs.length)%reshapeImgs.length;
    document.getElementById('reshapeImg').src=reshapeImgs[reshapeIndex];
  }
}

// 图片点击缩放
document.querySelectorAll('.viewPage img').forEach(img=>{
  let scale=1;
  img.addEventListener('click',()=>{
    scale=scale===1?2:1;
    img.style.transform=`scale(${scale})`;
  });
});
</script>
</body>
</html>
