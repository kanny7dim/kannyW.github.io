<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f;
  --fg: #ffffff;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas, canvas#lineCanvas {
  position: absolute;
  top:0; left:0;
  width: 100%; height: 100%;
}
canvas#bgCanvas { z-index:0; }
canvas#lineCanvas { z-index:1; pointer-events: none; }

.back-btn {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 32px;
  color: #fff;
  text-decoration: none;
  text-shadow: 0 0 12px #fff;
  z-index: 3;
}

.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 30px;
  font-size: 32px; 
  font-weight: 700;
  color: var(--fg);
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  position: relative;
}
.title-wrap div:hover {
  text-shadow: 0 0 25px rgba(255,255,255,1);
}

.series-wrap {
  position: absolute;
  top: 55%; /* 左下偏下调整 */
  left: 25%; /* 左移对齐Photography */
  transform: translateX(-50%);
  z-index: 2;
  display: none; /* 初始隐藏 */
  flex-direction: column;
  gap: 10px;
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  text-shadow: 0 0 8px rgba(255,255,255,0.8);
}
.series-wrap div {
  cursor: pointer;
}
.series-wrap div:hover {
  text-shadow: 0 0 20px rgba(255,255,255,1);
}

.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
  word-wrap: break-word;
}

@media(max-width:768px){
  .title-wrap { font-size: 24px; gap: 20px; }
  .series-wrap { font-size: 14px; gap: 8px; left: 20%; }
  .footer-text { font-size: 14px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="lineCanvas"></canvas>

<a href="index.html" class="back-btn">←</a>

<div class="title-wrap">
  <div id="photographyBtn">Photography</div>
  <div onclick="location.href='sound.html'">Sound</div>
  <div onclick="location.href='sculpture.html'">Sculpture</div>
</div>

<div class="series-wrap" id="photographySeries">
  <div>Endless World</div>
  <div>Time Line</div>
  <div>Perception</div>
</div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
const lineCanvas = document.getElementById('lineCanvas');
const lineCtx = lineCanvas.getContext('2d');

let W=0,H=0;
function resize(){ 
  W=canvas.clientWidth; 
  H=canvas.clientHeight; 
  canvas.width=W; 
  canvas.height=H;
  lineCanvas.width=W;
  lineCanvas.height=H;
}
window.addEventListener('resize',resize);
resize();

// 星空粒子背景
const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// 中间三个单词漂浮动画
const titles = document.querySelectorAll('.title-wrap div');
titles.forEach(t=>{
  let posX=0, posY=0;
  function floatAnim(){
    posX += (Math.random()-0.5)*0.3;
    posY += (Math.random()-0.5)*0.3;
    t.style.transform=`translate(${posX}px, ${posY}px)`;
    requestAnimationFrame(floatAnim);
  }
  floatAnim();
});

// 点击 Photography 显示系列
const photographyBtn = document.getElementById('photographyBtn');
const photographySeries = document.getElementById('photographySeries');

photographyBtn.addEventListener('click', () => {
  photographySeries.style.display = photographySeries.style.display === 'flex' ? 'none' : 'flex';
});

// 绘制柔和发光线连接首字母
function drawLines() {
  lineCtx.clearRect(0,0,W,H);
  if (photographySeries.style.display === 'flex') {
    const rects = Array.from(photographySeries.children).map(div=>div.getBoundingClientRect());
    for(let i=0;i<rects.length-1;i++){
      const x1 = rects[i].x + 8; // 首字母大概偏移
      const y1 = rects[i].y + rects[i].height/2;
      const x2 = rects[i+1].x + 8;
      const y2 = rects[i+1].y + rects[i+1].height/2;

      // 柔和发光多层线
      for(let glow=0; glow<6; glow++){
        lineCtx.beginPath();
        lineCtx.strokeStyle = `rgba(255,255,255,${0.05+0.05*glow})`;
        lineCtx.lineWidth = 0.5 + glow*0.3;
        lineCtx.moveTo(x1,y1);
        lineCtx.lineTo(x2,y2);
        lineCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawLines);
}
drawLines();
</script>

</body>
</html>
