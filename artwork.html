<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f;
  --fg: #ffffff;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 60px;
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  transition: text-shadow 0.5s, transform 0.5s;
}
.title-wrap div:hover {
  text-shadow: 0 0 30px rgba(0,255,127,0.9);
  transform: translateY(-2px);
}
.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
  word-wrap: break-word;
}
@media(max-width:768px){
  .title-wrap {
    flex-direction: column;
    gap: 30px;
    font-size: 24px;
  }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="title-wrap">
  <div onclick="location.href='endlessworld.html'">EndlessWorld</div>
  <div onclick="location.href='perception.html'">Perception</div>
  <div onclick="location.href='deeplistening.html'">DeepListening</div>
  <div onclick="location.href='reshaping.html'">Reshaping</div>
</div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  W=canvas.clientWidth; 
  H=canvas.clientHeight; 
  canvas.width=W; 
  canvas.height=H;
}
window.addEventListener('resize',resize);
resize();

// 星星数组
const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));

function drawStars(){
  ctx.clearRect(0,0,W,H);

  // 星空底色
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);

  // 星云1
  const grad1 = ctx.createRadialGradient(W*0.7,H*0.3,0,W*0.7,H*0.3,200);
  grad1.addColorStop(0,'rgba(200,180,255,0.05)');
  grad1.addColorStop(1,'rgba(200,180,255,0)');
  ctx.fillStyle = grad1;
  ctx.fillRect(0,0,W,H);

  // 星云2
  const grad2 = ctx.createRadialGradient(W*0.3,H*0.7,0,W*0.3,H*0.7,150);
  grad2.addColorStop(0,'rgba(255,200,180,0.04)');
  grad2.addColorStop(1,'rgba(255,200,180,0)');
  ctx.fillStyle = grad2;
  ctx.fillRect(0,0,W,H);

  // 绘制闪烁星星
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(drawStars);
}

drawStars();
</script>

</body>
</html>
