<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f; /* 星空背景 */
  --fg: #ffffff;
  --work-bg: #bfbfbf; /* 莫兰迪灰背景 */
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  color: var(--fg);
  overflow: hidden;
}
canvas#bgCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 60px;
  font-size: 32px;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  transition: text-shadow 0.5s, transform 0.5s;
  animation: glowMove 2s infinite alternate;
}
.title-wrap div:hover {
  text-shadow: 0 0 35px rgba(0,255,127,1);
  transform: translateY(-2px);
}
@keyframes glowMove {
  0% { text-shadow: 0 0 10px rgba(0,255,127,0.7); transform: translateY(0); }
  100% { text-shadow: 0 0 20px rgba(0,255,127,0.5); transform: translateY(2px); }
}

/* 作品查看页面 */
#workView {
  display: none;
  position: absolute;
  top:0; left:0;
  width: 100%; height: 100%;
  background: var(--work-bg);
  justify-content:center;
  align-items:center;
  flex-direction: column;
  z-index: 2;
}
#workView img {
  max-width: 90%;
  max-height: 80%;
}
#workView .back-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 36px;
  color: #000;
  cursor: pointer;
  z-index: 3;
  font-weight: bold;
}
/* 切换按钮 */
#prevBtn, #nextBtn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 36px;
  color: #000;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  line-height: 60px;
  text-align: center;
  cursor: pointer;
  z-index: 3;
  user-select: none;
}
#prevBtn { left: 20px; }
#nextBtn { right: 20px; }

/* 底部文字 */
.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
  word-wrap: break-word;
}

@media(max-width:768px){
  .title-wrap {
    flex-direction: column;
    gap: 30px;
    font-size: 24px;
  }
  #workView img { width: 90%; height: auto; }
  .footer-text { font-size: 14px; bottom: 20px; }
  #prevBtn, #nextBtn { font-size: 28px; width:50px; height:50px; line-height:50px;}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="title-wrap" id="categories">
  <div id="endlessBtn">EndlessWorld</div>
  <div id="perceptionBtn">Perception</div>
  <div id="deepBtn">DeepListening</div>
  <div id="reshapeBtn">Reshaping</div>
</div>

<!-- 单图查看 -->
<div id="workView">
  <span class="back-btn" onclick="closeWork()">&larr; Back</span>
  <img id="currentImg" src="EndlessWorld01.jpg.JPG" alt="Artwork">
  <span id="prevBtn">&#10094;</span>
  <span id="nextBtn">&#10095;</span>
</div>

<!-- 底部文字 -->
<div class="footer-text" id="footerText">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
// 星空+微星云+陨石
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){
  W=canvas.clientWidth; 
  H=canvas.clientHeight; 
  canvas.width=W; 
  canvas.height=H;
}
window.addEventListener('resize',resize);
resize();

const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
const clouds = Array.from({length:10},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*200+100, opacity:Math.random()*0.1+0.05
}));
const meteors = Array.from({length:5},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  len:Math.random()*50+30,
  speed:Math.random()*4+2,
  angle: Math.PI/4
}));

function drawBackground(){
  ctx.clearRect(0,0,W,H);
  // 星空底色
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  // 星云
  for(const c of clouds){
    ctx.beginPath();
    ctx.fillStyle=`rgba(200,200,200,${c.opacity})`;
    ctx.arc(c.x*W,c.y*H,c.r,0,Math.PI*2);
    ctx.fill();
  }
  // 星星
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  // 陨石
  for(const m of meteors){
    m.x += m.speed*Math.cos(m.angle);
    m.y += m.speed*Math.sin(m.angle);
    if(m.x>W || m.y>H){
      m.x = Math.random()*W;
      m.y = -50;
    }
    ctx.beginPath();
    ctx.strokeStyle='rgba(255,255,255,0.8)';
    ctx.lineWidth=2;
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.len*Math.cos(m.angle), m.y - m.len*Math.sin(m.angle));
    ctx.stroke();
  }
  requestAnimationFrame(drawBackground);
}
drawBackground();

// 点击进入作品查看
const categories = document.getElementById('categories');
const workView = document.getElementById('workView');
const currentImg = document.getElementById('currentImg');
const footerText = document.getElementById('footerText');

const endlessImgs = [
  "EndlessWorld01.jpg.JPG",
  "EndlessWorld02.jpg.JPG",
  "EndlessWorld03.jpg.JPG",
  "EndlessWorld04.jpg.JPG",
  "EndlessWorld05.jpg.JPG"
];

let idx = 0;

document.getElementById('endlessBtn').addEventListener('click', ()=>{
  categories.style.display='none';
  footerText.style.display='none';
  workView.style.display='flex';
  idx = 0;
  currentImg.src = endlessImgs[idx];
});

// 返回首页
function closeWork(){
  workView.style.display='none';
  categories.style.display='flex';
  footerText.style.display='block';
}

// 切换按钮
document.getElementById('prevBtn').addEventListener('click', ()=>{
  idx = (idx - 1 + endlessImgs.length) % endlessImgs.length;
  currentImg.src = endlessImgs[idx];
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  idx = (idx + 1) % endlessImgs.length;
  currentImg.src = endlessImgs[idx];
});
</script>

</body>
</html>
