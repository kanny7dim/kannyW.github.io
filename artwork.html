<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Work</title>
<style>
:root {
  --bg: #0b0b0f;
  --fg: #ffffff;
  --accent: #00ff99;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"><circle cx="8" cy="8" r="4" fill="%2300ff99"/></svg>') 8 8, auto;
}
canvas#bgCanvas {
  position: absolute;
  top:0; left:0;
  width: 100%; height: 100%;
  z-index: 0;
}
.back-btn {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 32px;
  color: #fff;
  text-decoration: none;
  text-shadow: 0 0 12px #fff;
  z-index: 3;
}
.title-wrap {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  display: flex;
  gap: 30px;
  font-size: 32px;
  font-weight: 700;
  color: var(--fg);
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
}
.title-wrap div {
  cursor: pointer;
  position: relative;
  transition: text-shadow 0.3s;
}
.title-wrap div:hover {
  text-shadow: 0 0 25px var(--accent);
}

/* 系列 */
.series-wrap {
  position: absolute;
  top: 52%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  opacity: 0;
  text-shadow: 0 0 8px rgba(255,255,255,0.9);
  pointer-events: none;
  transition: opacity 1.8s ease;
}
.series-wrap.visible {
  opacity: 1;
  pointer-events: auto;
}
.series-wrap div {
  cursor: pointer;
  transition: text-shadow 0.3s, transform 0.3s;
}
.series-wrap div:hover {
  text-shadow: 0 0 25px var(--accent);
  transform: scale(1.03);
}

.footer-text {
  position: fixed;
  bottom: 30px;
  width: 90%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #fff;
  font-size: 16px;
  text-shadow: 0 0 12px #fff;
  z-index: 2;
  line-height: 1.5;
}
@media(max-width:768px){
  .title-wrap { font-size: 24px; gap: 20px; }
  .series-wrap { font-size: 15px; gap: 10px; top: 54%; }
  .footer-text { font-size: 14px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<a href="index.html" class="back-btn">←</a>

<div class="title-wrap">
  <div id="photographyBtn">Photography</div>
  <div id="soundBtn">Sound</div>
  <div id="sculptureBtn">Sculpture</div>
</div>

<!-- Photography 系列 -->
<div class="series-wrap" id="photographySeries">
  <div>Endless World</div>
  <div>Time Line</div>
  <div>Perception</div>
</div>

<!-- Sound 系列 -->
<div class="series-wrap" id="soundSeries">
  <div>Soundscape</div>
  <div>Deep Listening</div>
</div>

<!-- Sculpture 系列 -->
<div class="series-wrap" id="sculptureSeries">
  <div>Reshaping</div>
  <div>Dialogue</div>
</div>

<div class="footer-text">
By means of sound, photography, and sculpture, they probe the unknown,<br>
perceiving fragility, grace, and resilience; all is inscribed, all is traceable.
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W=0,H=0;
function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W; canvas.height=H; }
window.addEventListener('resize',resize);
resize();

// 星空背景
const stars = Array.from({length:150},()=>({
  x:Math.random(), y:Math.random(), r:Math.random()*1.5+0.2,
  vx:(Math.random()-0.5)*0.0005, vy:(Math.random()-0.5)*0.0005
}));
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(8,9,12,0.9)';
  ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx; s.y += s.vy;
    if(s.x<0)s.x=1;if(s.x>1)s.x=0;
    if(s.y<0)s.y=1;if(s.y>1)s.y=0;
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,'+(0.6*Math.random()+0.2)+')';
    ctx.arc(s.x*W, s.y*H, s.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// 漂浮动画
const titles = document.querySelectorAll('.title-wrap div');
titles.forEach(t=>{
  let posX=0, posY=0;
  function floatAnim(){
    posX += (Math.random()-0.5)*0.3;
    posY += (Math.random()-0.5)*0.3;
    t.style.transform=`translate(${posX}px, ${posY}px)`;
    requestAnimationFrame(floatAnim);
  }
  floatAnim();
});

// 点击显示对应系列
const allSeries = document.querySelectorAll('.series-wrap');
document.addEventListener('click', e => {
  allSeries.forEach(s => s.classList.remove('visible'));

  if (e.target.id === 'photographyBtn') {
    document.getElementById('photographySeries').classList.add('visible');
    document.getElementById('photographySeries').style.left = "calc(50% - 240px)";
  } 
  else if (e.target.id === 'soundBtn') {
    document.getElementById('soundSeries').classList.add('visible');
    document.getElementById('soundSeries').style.left = "calc(50% - 70px)";
  } 
  else if (e.target.id === 'sculptureBtn') {
    document.getElementById('sculptureSeries').classList.add('visible');
    document.getElementById('sculptureSeries').style.left = "calc(50% + 110px)";
  }
});
</script>

</body>
</html>
