<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanny Wu</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: #dcdcdc;
  color: #222;
  overflow-x: hidden;
  position: relative;
}

/* 背景脚印动画 */
.footprint {
  position: absolute;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.1);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: floatUp 12s linear infinite;
  z-index: 0;
}

@keyframes floatUp {
  0% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
  50% { transform: translateY(-50px) rotate(15deg); opacity: 0.2; }
  100% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  box-sizing: border-box;
}

/* 名字 Glitch */
.site-name {
  font-weight: 700;
  font-size: 1.8rem;
  color: #222;
  position: relative;
  display: inline-block;
  overflow: hidden;
}

.site-name::before,
.site-name::after {
  content: 'Kanny Wu';
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  color: #222;
  overflow: hidden;
}

.site-name::before {
  animation: glitchTop 3s infinite linear alternate-reverse;
  clip: rect(2px, 9999px, 12px, 0);
}

.site-name::after {
  animation: glitchBottom 3s infinite linear alternate-reverse;
  clip: rect(15px, 9999px, 25px, 0);
}

@keyframes glitchTop {
  0%,100% { transform: translate(0px,0px); }
  25% { transform: translate(-1px,-1px); }
  50% { transform: translate(-0.5px,0.5px); }
  75% { transform: translate(0.5px,-0.5px); }
}

@keyframes glitchBottom {
  0%,100% { transform: translate(0px,0px); }
  25% { transform: translate(0.5px,0.5px); }
  50% { transform: translate(1px,-0.5px); }
  75% { transform: translate(-0.5px,0.5px); }
}

/* 折叠按钮 */
.menu-toggle {
  font-size: 1.6rem;
  background: #222;
  color: #fff;
  border: none;
  padding: 12px 18px;
  border-radius: 5px;
  cursor: pointer;
  z-index: 1002;
  position: relative;
}

.menu-toggle:hover {
  background: #ff6600;
}

/* 折叠菜单 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 220px;
  background: #dcdcdc;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 1001;
  padding: 10px 0;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 0.3s ease, max-height 0.4s ease;
}

.menu.show {
  opacity: 1;
  max-height: 500px;
}

.menu a {
  padding: 12px 20px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
  white-space: nowrap;
  display: block;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面内容 */
.container {
  max-width: 900px;
  margin: 120px auto 50px;
  padding: 0 20px;
}

section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName"></div>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<script>
// 生成脚印
window.onload = function() {
  const numFootprints = 15;
  for(let i=0; i<numFootprints; i++){
    const f = document.createElement('div');
    f.className = 'footprint';
    f.style.left = Math.random() * window.innerWidth + 'px';
    f.style.top = Math.random() * window.innerHeight + 'px';
    f.style.width = 30 + Math.random()*20 + 'px';
    f.style.height = 30 + Math.random()*20 + 'px';
    f.style.animationDuration = 8 + Math.random()*6 + 's';
    f.style.opacity = 0.05 + Math.random()*0.1;
    document.body.appendChild(f);
  }

  // 添加名字文字
  const siteNameDiv = document.getElementById('siteName');
  const nameText = 'Kanny Wu';
  for(let char of nameText) {
    const span = document.createElement('span');
    span.textContent = char;
    siteNameDiv.appendChild(span);
  }
};

// 折叠菜单功能
function toggleMenu() {
  const menu = document.getElementById('dropdownMenu');
  menu.classList.toggle('show');
}

// 点击空白处关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.classList.contains('show') && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.classList.remove('show');
  }
};
</script>

</body>
</html>
