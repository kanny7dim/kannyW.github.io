<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanny Wu</title>

<style>
/* 整体背景 */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: url('background.jpeg') no-repeat center center fixed;
  background-size: cover;
  position: relative;
  overflow: hidden;
  font-family: 'Helvetica Neue', sans-serif;
}

/* 在背景上加一层轻微的蒙版，避免字被淹没 */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.35);
  z-index: 0;
}

/* 左侧艺术家名字 */
.artist-name {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 48px;
  font-weight: 500;
  color: rgba(0, 0, 0, 0.8);
  letter-spacing: 2px;
  overflow: hidden;
  z-index: 2;
  animation: dissolve 5s ease-in-out infinite alternate;
}

/* 溶解—汇聚动画 */
@keyframes dissolve {
  0% {
    opacity: 0;
    filter: blur(8px);
    letter-spacing: 8px;
  }
  50% {
    opacity: 0.8;
    filter: blur(2px);
    letter-spacing: 3px;
  }
  100% {
    opacity: 1;
    filter: blur(0);
    letter-spacing: 1px;
  }
}

/* 右上角菜单按钮 */
.menu-toggle {
  position: fixed;
  top: 30px;
  right: 40px;
  width: 32px;
  height: 24px;
  cursor: pointer;
  z-index: 3;
  opacity: 0.8;
}

.menu-toggle div {
  height: 3px;
  background-color: rgba(255, 140, 0, 0.7);
  margin: 6px 0;
  border-radius: 2px;
  transition: all 0.4s ease;
}

.menu {
  position: fixed;
  top: 0;
  right: -250px;
  width: 250px;
  height: 100%;
  background-color: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(8px);
  transition: right 1.2s ease;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.menu a {
  color: rgba(0, 0, 0, 0.85);
  text-decoration: none;
  font-size: 18px;
  margin: 15px 0;
  letter-spacing: 1px;
  transition: color 0.3s ease;
}

.menu a:hover {
  color: #ff8c00;
}

/* 打开时的状态 */
.menu.open {
  right: 0;
}

.menu-toggle.open div:nth-child(1) {
  transform: rotate(45deg) translate(5px, 5px);
}

.menu-toggle.open div:nth-child(2) {
  opacity: 0;
}

.menu-toggle.open div:nth-child(3) {
  transform: rotate(-45deg) translate(6px, -6px);
}
</style>
</head>

<body>

<div class="artist-name">Kanny Wu</div>

<div class="menu-toggle" id="menuToggle">
  <div></div>
  <div></div>
  <div></div>
</div>

<div class="menu" id="menu">
  <a href="#">Home</a>
  <a href="#">Works</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</div>

<script>
const menuToggle = document.getElementById('menuToggle');
const menu = document.getElementById('menu');

menuToggle.addEventListener('click', () => {
  menu.classList.toggle('open');
  menuToggle.classList.toggle('open');
});
</script>

</body>
</html>
