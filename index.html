<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KannyWu</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background-color: #dcdcdc; /* 背景灰色 */
  color: #222;
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc;
  position: fixed;
  width: 100%;
  top: 0;
  box-sizing: border-box;
  z-index: 1000;
}

/* 左侧名字 */
.site-name {
  font-weight: bold;
  font-size: 32px;
  color: rgba(0,0,0,0.85); /* 黑色淡一点 */
  position: relative;
}

/* Glitch / 马赛克效果动态明显 */
.site-name span {
  position: relative;
  display: inline-block;
  color: rgba(0,0,0,0.85);
}

.site-name span::before,
.site-name span::after {
  content: attr(data-char);
  position: absolute;
  top: 0;
  left: 0;
  color: rgba(0,0,0,0.85);
  animation: glitchShift 1s infinite linear alternate-reverse;
}

.site-name span::before {
  clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
  opacity: 0.7;
}

.site-name span::after {
  clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
  opacity: 0.5;
}

@keyframes glitchShift {
  0% { transform: translate(0px, 0px); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(1px, -1px); }
  75% { transform: translate(-1px, 2px); }
  100% { transform: translate(2px, -2px); }
}

/* 右侧折叠菜单按钮 */
.menu-toggle {
  font-size: 18px;
  background: rgba(0,0,0,0.3);
  color: #e09050; /* 橙色 */
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 5px;
  z-index: 1001;
}

/* 菜单内容 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 200px;
  background: rgba(220,220,220,0.95);
  display: flex;
  flex-direction: column;
  padding: 10px 0;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 2s ease, max-height 3s ease; /* 折叠菜单过渡柔和 */
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 1000;
}

.menu.show {
  opacity: 1;
  max-height: 500px;
}

.menu a {
  padding: 10px 20px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面主体内容 */
.container {
  margin-top: 120px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
  padding: 0 20px;
}
section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName"></div>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<script>
// 名字 Glitch 文字生成
const siteNameDiv = document.getElementById('siteName');
const nameText = 'KannyWu';
siteNameDiv.innerHTML = '';
for (let char of nameText) {
  const span = document.createElement('span');
  span.setAttribute('data-char', char);
  span.textContent = char;
  siteNameDiv.appendChild(span);
}

// 菜单折叠
function toggleMenu() {
  document.getElementById('dropdownMenu').classList.toggle('show');
}

// 点击空白关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.classList.contains('show') && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.classList.remove('show');
  }
};
</script>

</body>
</html>
