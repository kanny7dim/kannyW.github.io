<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanny Wu</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #fdfdfd;
      color: #111;
    }

    /* 顶部导航栏 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 1em 0;
      background: #fff;
      border-bottom: 1px solid #ddd;
      z-index: 100;
    }

    /* 按钮样式 */
    nav a {
      display: inline-block;
      padding: 10px 20px;
      color: #111;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    nav a:hover {
      background-color: #eee;
      transform: translateY(-2px);
    }

    /* 页面内容容器 */
    .container {
      max-width: 900px;
      margin: 80px auto 50px; /* 顶部留空给导航 */
      padding: 0 20px;
    }

    section {
      margin-bottom: 100px;
      min-height: 400px; /* 占位空白区 */
      border-bottom: 1px solid #eee; /* 可选分隔线 */
    }
  </style>
</head>
<body>

  <nav>
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </nav>

  <div class="container">
    <section id="findme"></section>
    <section id="bio"></section>
    <section id="artwork"></section>
  </div>

</body>
</html>
