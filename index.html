<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KannyWu</title>
<style>
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: url('https://kanny7dim.github.io/kannyW.github.io/IMG_9403.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #111;
    overflow-x: hidden;
  }

  @keyframes dissolveIn {
    0% { opacity: 0; filter: blur(10px); letter-spacing: 10px; }
    50% { opacity: 0.5; filter: blur(4px); letter-spacing: 5px; }
    100% { opacity: 1; filter: blur(0); letter-spacing: normal; }
  }

  .name {
    font-size: 2.2em;
    font-weight: 600;
    color: #111;
    animation: dissolveIn 3.5s ease-out forwards;
    position: absolute;
    top: 30px;
    left: 40px;
    letter-spacing: 2px;
  }

  /* 菜单折叠 */
  .menu {
    position: fixed;
    top: 30px;
    right: 40px;
    z-index: 1000;
  }

  .menu-btn {
    background-color: rgba(0,255,100,0.3);
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 18px;
    color: #111;
    font-weight: bold;
    transition: box-shadow 0.3s;
  }

  .menu-btn:hover, .menu-btn:focus {
    box-shadow: 0 0 15px rgba(0,255,100,0.8), 0 0 30px rgba(0,255,100,0.6);
  }

  .menu-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: transparent;
    border-radius: 0;
    padding: 0;
    text-align: right;
    animation: fadeIn 0.5s ease forwards;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  .menu-content a {
    display: block;
    white-space: nowrap;
    color: rgba(0,255,100,0.7);
    text-decoration: none;
    margin: 20px 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(0,255,100,0.5);
    padding-bottom: 5px;
    transition: all 0.3s;
  }

  .menu-content a:hover {
    text-shadow: 0 0 10px rgba(0,255,100,0.8);
  }

  .show { display: block; }

  #content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #111;
    text-align: center;
    max-width: 80%;
    line-height: 1.6;
    font-size: 18px;
    display: none;
    opacity: 0;
  }

  @keyframes fadeInContent {
    from {opacity:0;}
    to {opacity:1;}
  }

  .insta-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 16px;
    background-color: rgba(0,0,0,0.5);
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    animation: ghost 2s infinite alternate;
  }

  @keyframes ghost {
    0% {transform: translateY(0);}
    100% {transform: translateY(-5px);}
  }

  #gameCanvas {
    display: none;
    margin: 0 auto;
    background: rgba(255,255,255,0.1);
  }

</style>
</head>
<body>

<div class="name">KannyWu</div>

<div class="menu">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div id="menuItems" class="menu-content">
    <a href="#" onclick="showContent('home')">Home</a>
    <a href="#" onclick="showContent('bio')">Bio</a>
    <a href="#" onclick="showContent('artwork')">Art Work</a>
    <a href="#" onclick="showContent('findme')">Find Me</a>
  </div>
</div>

<div id="content"></div>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
  function toggleMenu() {
    document.getElementById("menuItems").classList.toggle("show");
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById("menuItems");
    const btn = document.querySelector('.menu-btn');
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove('show');
    }
  });

  const content = document.getElementById('content');
  const canvas = document.getElementById('gameCanvas');
  let gameRunning = false;

  // 背景音乐，只在Home播放
  const audio = new Audio('https://kanny7dim.github.io/kannyW.github.io/JS1.mp3');
  audio.loop = true;

  function showContent(section) {
    content.style.display = 'none';
    canvas.style.display = 'none';
    content.innerHTML = '';
    content.style.opacity = 0;

    audio.pause(); // 每次点击都先停止音乐
    audio.currentTime = 0;

    if(section === 'home') {
      canvas.style.display = 'block';
      audio.play().catch(()=>console.log("Autoplay blocked"));
      if(!gameRunning) startGame();
    } else if(section === 'bio') {
      content.innerHTML = `<p>Kanny Wu</p>
      <p>Drawing from a background as a classical pianist, Kanny Wu works through sound, image, and sculpture as media to explore perception, fragility, and the position of materials, bodies, and memories in time. Each work creates a dialogue between sensory experience and the world, emphasizing vulnerability, identity, and coexistence.</p>`;
      fadeIn(content);
    } else if(section === 'findme') {
      content.innerHTML = `Email: kannywu227@gmail.com<br>
      <a href="https://www.instagram.com/kanny7dim?igsh=M2N4MTNqdm5rajM1&utm_source=qr" target="_blank" class="insta-btn">Instagram</a>`;
      fadeIn(content);
    } else if(section === 'artwork') {
      content.innerHTML = `<p>Art Work Section</p>`;
      fadeIn(content);
    }
  }

  function fadeIn(element) {
    element.style.display = 'block';
    element.style.animation = 'fadeInContent 2s forwards';
  }

  function startGame() {
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    let snowflakes = [];
    let score = 0;
    gameRunning = true;

    for(let i=0;i<50;i++){
      snowflakes.push({x:Math.random()*width, y:Math.random()*height, r:Math.random()*3+2, dx:0});
    }

    let playerX = width/2;

    canvas.addEventListener('mousemove', e=>{
      playerX = e.offsetX;
    });

    function draw() {
      ctx.clearRect(0,0,width,height);

      ctx.fillStyle='rgba(0,255,100,0.7)';
      ctx.fillRect(playerX-20,height-10,40,10);

      ctx.fillStyle='white';
      for(let flake of snowflakes){
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r,0,Math.PI*2);
        ctx.fill();

        flake.y += 1; 
        if(Math.abs(flake.x - playerX)<20 && flake.y>height-20){
          score++;
          flake.y=0;
          flake.x=Math.random()*width;
        }
        if(flake.y>height){
          flake.y=0;
          flake.x=Math.random()*width;
        }
      }

      ctx.fillStyle='rgba(0,255,100,0.8)';
      ctx.font='16px Arial';
      ctx.fillText('Score: '+score, 10, 20);

      requestAnimationFrame(draw);
    }

    draw();
  }

  // 默认显示Home
  showContent('home');
</script
