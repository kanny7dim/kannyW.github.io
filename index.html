<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KannyWu</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 全局样式 */
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: #dcdcdc;
  color: #222;
  overflow-x: hidden;
  position: relative;
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  box-sizing: border-box;
}

/* 名字 Glitch */
.site-name {
  font-weight: 700;
  font-size: 1.8rem;
  color: #000; /* 黑色 */
  position: relative;
  display: inline-block;
}

.site-name span {
  display: inline-block;
  position: relative;
  mix-blend-mode: difference;
  animation: mosaic 1.5s infinite alternate;
}

@keyframes mosaic {
  0% { clip-path: inset(0% 0% 0% 0%); }
  25% { clip-path: inset(15% 5% 20% 0%); }
  50% { clip-path: inset(20% 10% 10% 5%); }
  75% { clip-path: inset(5% 15% 15% 10%); }
  100% { clip-path: inset(0% 0% 0% 0%); }
}

/* 折叠按钮 */
.menu-toggle {
  font-size: 1.2rem;
  background: rgba(34,34,34,0.5); /* 半透明 */
  color: #e09050;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
  z-index: 1002;
  position: relative;
}

.menu-toggle:hover {
  background: rgba(51,51,51,0.5);
}

/* 折叠菜单 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 220px;
  background: #dcdcdc;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 1001;
  padding: 10px 0;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 2s ease, max-height 3s ease;
}

.menu.show {
  opacity: 1;
  max-height: 500px;
}

.menu a {
  padding: 12px 20px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
  white-space: nowrap;
  display: block;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面内容 */
.container {
  max-width: 900px;
  margin: 120px auto 80px;
  padding: 0 20px;
}

section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName"></div>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<script>
// 名字 Glitch
window.onload = function() {
  const siteNameDiv = document.getElementById('siteName');
  const nameText = 'KannyWu';
  for(let char of nameText) {
    const span = document.createElement('span');
    span.textContent = char;
    siteNameDiv.appendChild(span);
  }
};

// 折叠菜单
function toggleMenu() {
  const menu = document.getElementById('dropdownMenu');
  menu.classList.toggle('show');
}

// 点击空白关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.classList.contains('show') && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.classList.remove('show');
  }
};
</script>

</body>
</html>
