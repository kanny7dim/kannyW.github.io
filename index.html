<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KannyWu</title>
<style>
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: url('https://kanny7dim.github.io/kannyW.github.io/IMG_9403.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #111;
    overflow-x: hidden;
  }

  /* 名字动画 */
  @keyframes dissolveIn {
    0% { opacity: 0; filter: blur(10px); letter-spacing: 10px; }
    50% { opacity: 0.5; filter: blur(4px); letter-spacing: 5px; }
    100% { opacity: 1; filter: blur(0); letter-spacing: normal; }
  }

  .name {
    font-size: 2.2em;
    font-weight: 600;
    color: #111;
    animation: dissolveIn 3.5s ease-out forwards;
    position: absolute;
    top: 30px;
    left: 40px;
    letter-spacing: 2px;
  }

  /* 菜单容器 */
  .menu {
    position: fixed;
    top: 30px;
    right: 40px;
    z-index: 1000;
  }

  /* 菜单按钮 */
  .menu-btn {
    background-color: rgba(255, 140, 0, 0.7);
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 18px;
    color: #111;
    font-weight: bold;
    transition: background-color 0.3s;
  }

  .menu-btn:hover {
    background-color: rgba(255, 140, 0, 0.9);
  }

  /* 菜单内容 */
  .menu-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: transparent; /* 去掉白色框 */
    border-radius: 0;
    padding: 0;
    text-align: right;
    box-shadow: none; /* 去掉阴影 */
    animation: fadeIn 1.5s ease forwards;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  /* 导航链接样式 */
  .menu-content a {
    display: block;
    white-space: nowrap; /* 保证 Art Work 不拆行 */
    color: #111;
    text-decoration: none;
    margin: 30px 0; /* 上下间隔更大 */
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    border-bottom: 1px solid #111; /* 每条名字下面一条横线 */
    padding-bottom: 5px; /* 横线和文字稍微分开 */
    transition: color 0.3s;
  }

  .menu-content a:hover {
    color: #ff8800;
  }

  .show { display: block; animation: fadeIn 1.5s ease forwards; }

</style>
</head>
<body>

<div class="name">KannyWu</div>

<div class="menu">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div id="menuItems" class="menu-content">
    <a href="#">Bio</a>
    <a href="#">Art Work</a>
    <a href="#">Find Me</a>
  </div>
</div>

<script>
  function toggleMenu() {
    const menu = document.getElementById("menuItems");
    menu.classList.toggle("show");
  }

  // 点击页面其他地方关闭菜单
  document.addEventListener('click', function(e) {
    const menu = document.getElementById("menuItems");
    const btn = document.querySelector('.menu-btn');
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove('show');
    }
  });
</script>

</body>
</html>
