<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanny Wu</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: #dcdcdc;
  color: #222;
  overflow-x: hidden;
  position: relative;
}

/* 背景脚印动画 */
.footprint {
  position: absolute;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.1);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: floatUp 12s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
  50% { transform: translateY(-50px) rotate(15deg); opacity: 0.2; }
  100% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  box-sizing: border-box;
}

/* 名字动画 */
.site-name {
  font-weight: 700;
  font-size: 1.8rem;
  color: #222;
  display: inline-block;
  letter-spacing: 1px;
  overflow: hidden;
}

.site-name span {
  display: inline-block;
  animation: disperse 1.5s ease-in-out infinite alternate;
}

.site-name span:nth-child(1) { animation-delay: 0s; }
.site-name span:nth-child(2) { animation-delay: 0.1s; }
.site-name span:nth-child(3) { animation-delay: 0.2s; }
.site-name span:nth-child(4) { animation-delay: 0.3s; }
.site-name span:nth-child(5) { animation-delay: 0.4s; }
.site-name span:nth-child(6) { animation-delay: 0.5s; }
.site-name span:nth-child(7) { animation-delay: 0.6s; }
.site-name span:nth-child(8) { animation-delay: 0.7s; }

@keyframes disperse {
  0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
  50% { transform: translate(-8px,-15px) rotate(-20deg); opacity: 0; }
  100% { transform: translate(0,0) rotate(0deg); opacity: 1; }
}

/* 折叠按钮 */
.menu-toggle {
  font-size: 1.6rem;
  background: #222;
  color: #fff;
  border: none;
  padding: 12px 18px;
  border-radius: 5px;
  cursor: pointer;
  z-index: 1002;
  position: relative;
}

.menu-toggle:hover {
  background: #ff6600;
}

/* 折叠菜单 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 220px;
  background: #dcdcdc;
  display: none;
  flex-direction: column;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 1001;
  padding: 10px 0;
}

.menu a {
  padding: 12px 20px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
  white-space: nowrap;
  display: block;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面内容 */
.container {
  max-width: 900px;
  margin: 120px auto 50px;
  padding: 0 20px;
}

section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName">
    <span>K</span><span>a</span><span>n</span><span>n</span><span>y</span>
    <span> </span>
    <span>W</span><span>u</span>
  </div>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<!-- 脚印元素 -->
<script>
const numFootprints = 15;
for(let i=0; i<numFootprints; i++){
  const f = document.createElement('div');
  f.className = 'footprint';
  f.style.left = Math.random() * window.innerWidth + 'px';
  f.style.top = (Math.random() * window.innerHeight) + 'px';
  f.style.width = 30 + Math.random()*20 + 'px';
  f.style.height = 30 + Math.random()*20 + 'px';
  f.style.animationDuration = 8 + Math.random()*6 + 's';
  f.style.opacity = 0.05 + Math.random()*0.1;
  document.body.appendChild(f);
}

// 菜单折叠功能
function toggleMenu() {
  const menu = document.getElementById('dropdownMenu');
  if (menu.style.display === 'flex' || menu.style.display === 'block') {
    menu.style.display = 'none';
  } else {
    menu.style.display = 'flex';
    menu.style.flexDirection = 'column';
  }
}

// 点击空白处关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.style.display === 'flex' && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.style.display = 'none';
  }
}
</script>

</body>
</html>
