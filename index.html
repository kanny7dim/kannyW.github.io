<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanny Wu</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: #dcdcdc; /* 页面灰色背景 */
  color: #222;
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc; /* 顶部灰色 */
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
}

/* 名字动画容器 */
.site-name {
  font-weight: 700;
  font-size: 1.8rem;
  color: #222; /* 名字黑色 */
  overflow: hidden;
  display: inline-block;
  letter-spacing: 1px;
}

/* 粒子消散聚集动画 */
.site-name span {
  display: inline-block;
  animation: disperse 1.5s ease-in-out infinite alternate;
}

@keyframes disperse {
  0% { opacity: 1; transform: translate(0,0); }
  50% { opacity: 0; transform: translate(-10px,-20px) rotate(-20deg); }
  100% { opacity: 1; transform: translate(0,0); }
}

/* 折叠按钮 */
.menu-toggle {
  font-size: 1.2rem;
  background: none;
  border: 2px solid #222;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  color: #222;
  transition: all 0.3s ease;
}

.menu-toggle:hover {
  background: #222;
  color: #fff;
}

/* 折叠菜单 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 200px;
  background: #dcdcdc; /* 灰色背景 */
  border-radius: 6px;
  display: none;
  flex-direction: column;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 1001;
}

.menu a {
  padding: 12px 20px;
  text-decoration: none;
  color: #222; /* 黑灰色文字 */
  font-weight: 600;
  white-space: nowrap;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面内容 */
.container {
  max-width: 900px;
  margin: 120px auto 50px;
  padding: 0 20px;
}

section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName">
    <span>K</span><span>a</span><span>n</span><span>n</span><span>y</span>
    <span> </span>
    <span>W</span><span>u</span>
  </div>
  <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<script>
function toggleMenu() {
  const menu = document.getElementById('dropdownMenu');
  menu.style.display = (menu.style.display === 'flex' || menu.style.display === 'block') ? 'none' : 'flex';
}

// 点击空白处关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.style.display === 'flex' && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.style.display = 'none';
  }
}
</script>

</body>
</html>
