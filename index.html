<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanny Wu</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #e6e6e6; /* 浅灰背景 */
      color: #222; /* 深灰文字 */
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
    }
    .site-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: #333; /* 黑灰色名字 */
    }
    nav {
      position: relative;
    }
    nav .menu-toggle {
      cursor: pointer;
      font-size: 1rem;
      color: #333;
      background: none;
      border: none;
      padding: 8px 12px;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: none; /* 初始隐藏 */
      position: absolute;
      right: 0;
      top: 40px;
      background: #fff;
      border: 1px solid #ccc;
    }
    nav ul li {
      padding: 10px 20px;
    }
    nav ul li a {
      text-decoration: none;
      color: #222;
      font-weight: 600;
    }
    nav ul li a:hover {
      color: #555;
    }
    .container {
      max-width: 900px;
      margin: 100px auto 50px;
      padding: 0 20px;
    }
    section {
      margin-bottom: 100px;
      min-height: 400px;
      border-bottom: 1px solid #eee;
    }
  </style>
  <script>
    function toggleMenu() {
      const ul = document.querySelector('nav ul');
      ul.style.display = (ul.style.display === 'block') ? 'none' : 'block';
    }
  </script>
</head>
<body>

  <header>
    <div class="site-name">Kanny Wu</div>
    <nav>
      <button class="menu-toggle" onclick="toggleMenu()">Menu ▼</button>
      <ul>
        <li><a href="#findme">Find Me</a></li>
        <li><a href="#bio">Bio</a></li>
        <li><a href="#artwork">Art Work</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <section id="findme"></section>
    <section id="bio"></section>
    <section id="artwork"></section>
  </div>

</body>
</html>
