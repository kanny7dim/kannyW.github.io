<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KannyWu</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background-color: #dcdcdc;
  color: #222;
}

/* 顶部导航 */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 50px;
  background: #dcdcdc;
  position: fixed;
  width: 100%;
  top: 0;
  box-sizing: border-box;
  z-index: 1000;
}

/* 左侧名字 */
.site-name {
  font-weight: bold;
  font-size: 24px;
  color: #000;
  position: relative;
}

/* Glitch 效果 */
.site-name span {
  position: relative;
  display: inline-block;
  animation: glitch 1.5s infinite;
}

@keyframes glitch {
  0% { clip-path: inset(0% 0% 0% 0%); transform: translate(0,0);}
  20% { clip-path: inset(5% 0 15% 0); transform: translate(-1px,1px);}
  40% { clip-path: inset(10% 0 5% 0); transform: translate(1px,-1px);}
  60% { clip-path: inset(5% 0 10% 0); transform: translate(-1px,0);}
  80% { clip-path: inset(0% 0 0% 0); transform: translate(1px,1px);}
  100% { clip-path: inset(0% 0 0% 0); transform: translate(0,0);}
}

/* 右侧折叠菜单按钮 */
.menu-toggle {
  font-size: 18px;
  background: rgba(0,0,0,0.3);
  color: #e09050;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 5px;
  z-index: 1001;
}

/* 菜单内容 */
.menu {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 200px;
  background: #dcdcdc;
  display: flex;
  flex-direction: column;
  padding: 10px 0;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 2s ease, max-height 3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 1000;
}

.menu.show {
  opacity: 1;
  max-height: 500px;
}

.menu a {
  padding: 10px 20px;
  text-decoration: none;
  color: #222;
  font-weight: 600;
}

.menu a:hover {
  background: #c0c0c0;
}

/* 页面主体内容 */
.container {
  margin-top: 120px;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
  padding: 0 20px;
}
section {
  min-height: 400px;
  border-bottom: 1px solid #bbb;
  margin-bottom: 80px;
}
</style>
</head>
<body>

<header>
  <div class="site-name" id="siteName"></div>
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  <div class="menu" id="dropdownMenu">
    <a href="#findme">Find Me</a>
    <a href="#bio">Bio</a>
    <a href="#artwork">Art Work</a>
  </div>
</header>

<div class="container">
  <section id="findme"></section>
  <section id="bio"></section>
  <section id="artwork"></section>
</div>

<script>
// 保证名字渲染
const nameDiv = document.getElementById('siteName');
const nameText = 'KannyWu';
nameDiv.innerHTML = '';
for (let char of nameText) {
  const span = document.createElement('span');
  span.textContent = char;
  nameDiv.appendChild(span);
}

// 菜单折叠
function toggleMenu() {
  document.getElementById('dropdownMenu').classList.toggle('show');
}

// 点击空白关闭菜单
window.onclick = function(event) {
  const menu = document.getElementById('dropdownMenu');
  const button = document.querySelector('.menu-toggle');
  if (menu.classList.contains('show') && !button.contains(event.target) && !menu.contains(event.target)) {
    menu.classList.remove('show');
  }
};
</script>

</body>
</html>
