<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanny Wu</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", sans-serif;
      background: #f5f5f5; /* 浅灰背景 */
      color: #111;
    }

    /* 顶部容器 */
    header {
      display: flex;
      flex-direction: column;
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 100;
    }

    /* 名字 */
    .site-name {
      font-size: 2rem;
      font-weight: bold;
      color: orange;
      margin-bottom: 15px;
    }

    /* 导航菜单 */
    nav {
      display: flex;
      justify-content: space-between; /* 均匀分散 */
      max-width: 500px; /* 可以调整导航栏宽度 */
      width: 100%;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: #ff6600; /* 悬停变深橙色 */
    }

    /* 页面内容容器 */
    .container {
      max-width: 900px;
      margin: 130px auto 50px; /* 顶部留空给导航 */
      padding: 0 20px;
    }

    section {
      margin-bottom: 100px;
      min-height: 400px; /* 占位空白区 */
      border-bottom: 1px solid #eee; /* 可选分隔线 */
    }
  </style>
</head>
<body>

  <header>
    <div class="site-name">Kanny Wu</div>
    <nav>
      <a href="#findme">Find Me</a>
      <a href="#bio">Bio</a>
      <a href="#artwork">Art Work</a>
    </nav>
  </header>

  <div class="container">
    <section id="findme"></section>
    <section id="bio"></section>
    <section id="artwork"></section>
  </div>

</body>
</html>
